<!doctype html>
<!-- Vanta by soybean_alien. Repo banner, rendered to docs/banner.png at 2560x1280:
     node_modules/electron/dist/electron design/icons/render.cjs tools/banner/banner.html docs/banner.png 2560 1280 -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Jost';
        src: url('../../node_modules/@fontsource-variable/jost/files/jost-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      :root {
        --gold: #e5a00d;
        --gold-hi: #f7c65a;
        --ink: #f3efe6;
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 2560px; height: 1280px; overflow: hidden; background: #040405; }
      body { position: relative; font-family: 'Segoe UI', system-ui, sans-serif; color: var(--ink); }

      /* atmosphere: eclipse glow behind the type, warm haze on the right, faint stars */
      .sky { position: absolute; inset: 0;
        background:
          radial-gradient(820px 820px at 435px 370px, rgba(229, 160, 13, 0.16), transparent 62%),
          radial-gradient(1400px 700px at 1850px 1040px, rgba(229, 160, 13, 0.10), transparent 70%),
          radial-gradient(1600px 900px at 50% 0%, #0d0e12 0%, #040405 70%); }
      .stars { position: absolute; inset: 0; opacity: 0.55;
        background-image:
          radial-gradient(1.6px 1.6px at 12% 18%, #fff 50%, transparent 51%),
          radial-gradient(1.2px 1.2px at 27% 72%, #fff 50%, transparent 51%),
          radial-gradient(1.4px 1.4px at 41% 12%, #fff 50%, transparent 51%),
          radial-gradient(1.2px 1.2px at 58% 8%, #fff 50%, transparent 51%),
          radial-gradient(1.8px 1.8px at 66% 22%, #f7c65a 50%, transparent 51%),
          radial-gradient(1.2px 1.2px at 79% 6%, #fff 50%, transparent 51%),
          radial-gradient(1.4px 1.4px at 92% 16%, #fff 50%, transparent 51%),
          radial-gradient(1.2px 1.2px at 7% 88%, #fff 50%, transparent 51%),
          radial-gradient(1.4px 1.4px at 34% 94%, #fff 50%, transparent 51%),
          radial-gradient(1.2px 1.2px at 48% 60%, #fff 50%, transparent 51%); }

      /* the eclipse */
      .eclipse { position: absolute; left: 175px; top: 110px; width: 520px; height: 520px; }
      .eclipse .halo { position: absolute; inset: -150px; border-radius: 50%;
        background: radial-gradient(circle, transparent 38%, rgba(229, 160, 13, 0.55) 46%, rgba(229, 160, 13, 0.16) 58%, transparent 72%); filter: blur(6px); }
      .eclipse .ring { position: absolute; inset: 60px; border-radius: 50%;
        background: radial-gradient(circle, #000 0 69%, var(--gold-hi) 71%, var(--gold) 86%, rgba(229, 160, 13, 0.0) 100%);
        box-shadow: 0 0 120px rgba(247, 198, 90, 0.55), inset 0 0 60px rgba(0, 0, 0, 0.9); }
      .eclipse .flare { position: absolute; left: 350px; top: 74px; width: 120px; height: 120px; border-radius: 50%;
        background: radial-gradient(circle, #fff 0 6%, rgba(255, 233, 180, 0.9) 12%, rgba(247, 198, 90, 0.35) 34%, transparent 66%); }

      /* type */
      .type { position: absolute; left: 160px; top: 700px; width: 1150px; }
      .word { font-family: 'Jost', sans-serif; font-weight: 600; font-size: 150px; letter-spacing: 0.24em; line-height: 1; margin-left: -6px; }
      .tag { font-family: 'Jost', sans-serif; font-weight: 500; font-size: 34px; letter-spacing: 0.62em; color: var(--gold); margin-top: 26px; }
      /* warm sand earth tones: readable on black, distinct from the white wordmark and the gold accent */
      .line { font-size: 34px; line-height: 1.45; color: #c2b199; margin-top: 40px; letter-spacing: 0.01em; max-width: 1010px; }
      .line b { color: #dcc9a8; font-weight: 600; }

      /* stage: the app window tilted toward the viewer, on a lit horizon */
      .horizon { position: absolute; left: 1080px; right: -40px; top: 1118px; height: 3px;
        background: linear-gradient(90deg, transparent, rgba(247, 198, 90, 0.95) 30%, rgba(247, 198, 90, 0.95) 72%, transparent);
        box-shadow: 0 0 40px 8px rgba(229, 160, 13, 0.45); }
      .floor { position: absolute; left: 1080px; right: 0; top: 1121px; bottom: 0;
        background: radial-gradient(900px 200px at 60% 0%, rgba(229, 160, 13, 0.20), transparent 70%); }
      .stage { position: absolute; left: 1250px; top: 150px; width: 1270px; height: 840px; perspective: 2600px; }
      .window { position: absolute; inset: 0; border-radius: 26px; overflow: hidden; transform-origin: 30% 60%;
        transform: rotateY(-16deg) rotateX(5deg) rotateZ(0.6deg) scale(0.98);
        box-shadow: 0 0 0 2px rgba(247, 198, 90, 0.35), 0 60px 140px rgba(0, 0, 0, 0.85), 0 0 160px rgba(229, 160, 13, 0.18); }
      .window img { display: block; width: 100%; height: 100%; }
      .window::after { content: ''; position: absolute; inset: 0;
        background: linear-gradient(115deg, rgba(255, 255, 255, 0.10) 0%, transparent 28%, transparent 70%, rgba(229, 160, 13, 0.10) 100%); }
      .reflection { position: absolute; left: 1250px; top: 1124px; width: 1270px; height: 150px; perspective: 2600px; opacity: 0.22; overflow: hidden;
        -webkit-mask-image: linear-gradient(to bottom, #000, transparent 85%); }
      .reflection .window { inset: auto; top: -840px; left: 0; width: 1270px; height: 840px; transform: scaleY(-1) rotateY(16deg) rotateX(5deg); box-shadow: none; filter: blur(3px); }

      /* maker's mark */
      .emblem { position: absolute; right: 70px; bottom: 54px; width: 300px; height: 300px; border-radius: 50%;
        box-shadow: 0 0 0 6px #040405, 0 0 0 9px rgba(247, 198, 90, 0.85), 0 20px 70px rgba(0, 0, 0, 0.8), 0 0 90px rgba(229, 160, 13, 0.35); overflow: hidden; }
      .emblem img { width: 100%; height: 100%; display: block; }
      .by { position: absolute; right: 400px; bottom: 96px; font-family: 'Jost', sans-serif; font-size: 34px; font-weight: 500; letter-spacing: 0.08em; color: var(--gold-hi); }

      .meta { position: absolute; left: 150px; bottom: 74px; font-size: 26px; color: #7d8391; letter-spacing: 0.04em; }
      .meta span { color: #4b505b; margin: 0 16px; }
    </style>
  </head>
  <body>
    <div class="sky"></div>
    <div class="stars"></div>

    <div class="eclipse"><div class="halo"></div><div class="ring"></div><div class="flare"></div></div>

    <div class="type">
      <div class="word">VANTA</div>
      <div class="tag">PRIVATE CINEMA</div>
      <div class="line">A lightweight, fast and quiet beautiful home for all the <b>films and shows you already own.</b></div>
    </div>

    <div class="floor"></div>
    <div class="horizon"></div>
    <div class="stage"><div class="window"><img src="app.png" /></div></div>


    <div class="by">by soybean_alien</div>
    <div class="emblem"><img src="soybean_alien-logo.png" /></div>

    <div class="meta">v1.0.0<span>·</span>Windows 10 &amp; 11<span>·</span>For Plex Media Server<span>·</span>Free &amp; open source (GPL-3.0)</div>
  </body>
</html>
